<text x="200" y="2025" class="nota" font-size="26" dominant-baseline="central">★ As vagas nº 3, 12 e 17 têm espaços excedentes pertencentes ao</text>
<text x="200" y="2061" class="nota" font-size="26" dominant-baseline="central">condomínio. Caso venham a ser</text>
<text x="200" y="2097" class="nota" font-size="26" dominant-baseline="central">ocupados por um 2º veículo, essas ocupações serão cobradas.</text>
<text x="200" y="2133" class="nota" font-size="26" dominant-baseline="central">Vagas adicionais pertencentes ao condomínio: 2, 15, 18, 20 e 24. A vaga 8</text>
<text x="200" y="2169" class="nota" font-size="26" dominant-baseline="central">deu lugar ao bicicletário.</text>
